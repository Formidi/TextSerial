<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テキスト支援ツール</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-soft: #151925;
      --card: #1b2030;
      --card-strong: #22283a;
      --text: #edf2ff;
      --sub: #aab3c7;
      --line: #343c52;
      --line-strong: #59647e;
      --accent: #73a7ff;
      --accent-weak: rgba(115, 167, 255, 0.16);
      --error: #ff8b8b;
      --ok: #8df0b0;
      --shadow: rgba(0, 0, 0, 0.38);
      --tab-icon-size: 32px;
      --tab-icon-sheet-width: 64px;
      --tab-icon-sheet-height: 32px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(115, 167, 255, 0.12), transparent 34%),
        linear-gradient(180deg, #10131b 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.9rem;
      letter-spacing: 0.04em;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.35rem;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--sub);
    }

    .tool-tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0 0 20px;
      padding: 8px;
      width: max-content;
      max-width: 100%;
      background: rgba(21, 25, 37, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 28px var(--shadow);
    }

    .tool-tab {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .tool-tab:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--line);
    }

    .tool-tab.is-active {
      background: var(--accent-weak);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(115, 167, 255, 0.16);
    }

    .tool-tab:focus-visible {
      outline: 3px solid rgba(115, 167, 255, 0.55);
      outline-offset: 2px;
    }

    .tab-icon {
      display: block;
      width: var(--tab-icon-size);
      height: var(--tab-icon-size);
      background-image: url("img/icon.png");
      background-repeat: no-repeat;
      background-size: var(--tab-icon-sheet-width) var(--tab-icon-sheet-height);
    }

    .tool-tab[data-tool="serial"] .tab-icon { background-position: 0 0; }
    .tool-tab[data-tool="unicode"] .tab-icon { background-position: calc(var(--tab-icon-size) * -1) 0; }

    .tool-panel[hidden] { display: none; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: linear-gradient(180deg, var(--card) 0%, #181d2a 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 30px var(--shadow);
    }

    label.title {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .help {
      margin: 0 0 10px;
      font-size: 0.94rem;
      color: var(--sub);
    }

    textarea,
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #111521;
      color: var(--text);
      caret-color: var(--accent);
    }

    textarea:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(115, 167, 255, 0.18);
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      white-space: pre-wrap;
    }

    textarea::placeholder { color: #6f7890; }

    input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px;
      align-items: end;
      margin-top: 14px;
    }

    .checkrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--text);
      user-select: none;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary {
      background: var(--accent-weak);
      color: var(--accent);
      border: 1px solid rgba(115, 167, 255, 0.32);
    }

    .secondary:hover {
      background: rgba(115, 167, 255, 0.24);
    }

    .status {
      min-height: 1.6em;
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .status.error { color: var(--error); }
    .status.ok { color: var(--ok); }

    .result {
      min-height: 340px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f131e;
    }

    .meta {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--sub);
    }

    code {
      background: #101521;
      color: #cfe0ff;
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .tool-tabs { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>テキスト支援ツール</h1>
    <p class="lead">用途に合わせて上部のアイコンタブを切り替えてください。</p>

    <nav class="tool-tabs" aria-label="ツール切り替え">
      <button class="tool-tab is-active" type="button" data-tool="serial" role="tab" aria-selected="true" aria-controls="serialPanel" title="テキスト連番ツール" aria-label="テキスト連番ツール">
        <span class="tab-icon" aria-hidden="true"></span>
      </button>
      <button class="tool-tab" type="button" data-tool="unicode" role="tab" aria-selected="false" aria-controls="unicodePanel" title="文字コード追記ツール" aria-label="文字コード追記ツール">
        <span class="tab-icon" aria-hidden="true"></span>
      </button>
    </nav>

    <section id="serialPanel" class="tool-panel" data-panel="serial" role="tabpanel">
      <h2>テキスト連番ツール</h2>
      <div class="grid">
        <section class="card">
          <label class="title" for="templateInput">入力</label>
          <p class="help">
            連番は <code>[開始番号,桁数]</code> で指定します。<br>
            例：<code>テスト[101,4]</code> → 1回目は <code>テスト0101</code><br>
            改行もそのまま使えます。
          </p>
          <textarea id="templateInput" spellcheck="false">テスト[101,4]</textarea>

          <div class="controls">
            <div>
              <label class="title" for="repeatCount">試行回数</label>
              <input id="repeatCount" type="number" min="1" max="10000" value="5" />
            </div>
            <div>
              <label class="title">改行有無</label>
              <label class="checkrow">
                <input id="lineBreakMode" type="checkbox" />
                結果を各試行ごとに改行して分ける
              </label>
            </div>
          </div>

          <div class="buttons">
            <button id="copySerialBtn" class="secondary" type="button">結果をコピー</button>
          </div>

          <div id="serialStatus" class="status"></div>
        </section>

        <section class="card">
          <label class="title" for="resultOutput">結果</label>
          <textarea id="resultOutput" class="result" spellcheck="false" readonly></textarea>
          <div id="serialMeta" class="meta">文字数: 0</div>
        </section>
      </div>
    </section>

    <section id="unicodePanel" class="tool-panel" data-panel="unicode" role="tabpanel" hidden>
      <h2>文字コード追記ツール</h2>
      <div class="grid">
        <section class="card">
          <label class="title" for="unicodeInput">入力</label>
          <p class="help">
            文字を入力すると、1文字ごとにUnicodeコードポイントを追記します。<br>
            例：<code>安以宇</code>
          </p>
          <textarea id="unicodeInput" spellcheck="false" placeholder="安以宇">安以宇</textarea>

          <div class="buttons">
            <button id="copyUnicodeBtn" class="secondary" type="button">結果をコピー</button>
          </div>

          <div id="unicodeStatus" class="status"></div>
        </section>

        <section class="card">
          <label class="title" for="unicodeOutput">結果</label>
          <textarea id="unicodeOutput" class="result" spellcheck="false" readonly></textarea>
          <div id="unicodeMeta" class="meta">対象文字数: 0</div>
        </section>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const tabs = Array.from(document.querySelectorAll('.tool-tab'));
      const panels = Array.from(document.querySelectorAll('.tool-panel'));

      const templateInput = document.getElementById('templateInput');
      const repeatCount = document.getElementById('repeatCount');
      const lineBreakMode = document.getElementById('lineBreakMode');
      const resultOutput = document.getElementById('resultOutput');
      const serialStatus = document.getElementById('serialStatus');
      const serialMeta = document.getElementById('serialMeta');
      const copySerialBtn = document.getElementById('copySerialBtn');

      const unicodeInput = document.getElementById('unicodeInput');
      const unicodeOutput = document.getElementById('unicodeOutput');
      const unicodeStatus = document.getElementById('unicodeStatus');
      const unicodeMeta = document.getElementById('unicodeMeta');
      const copyUnicodeBtn = document.getElementById('copyUnicodeBtn');

      const SERIAL_PATTERN = /\[(\d+)\s*,\s*(\d+)\]/g;
      const WHITESPACE_PATTERN = /\s/u;

      function setStatus(target, message, type = '') {
        target.textContent = message;
        target.className = `status ${type}`.trim();
      }

      function padNumber(value, digits) {
        return String(value).padStart(digits, '0');
      }

      function renderOne(template, index) {
        let matched = false;
        const rendered = template.replace(SERIAL_PATTERN, (_, start, digits) => {
          matched = true;
          const startNumber = Number(start);
          const digitCount = Number(digits);

          if (!Number.isInteger(startNumber) || !Number.isInteger(digitCount) || digitCount < 1) {
            throw new Error('連番指定の形式が不正です。');
          }

          return padNumber(startNumber + index, digitCount);
        });

        return { rendered, matched };
      }

      function generateSerialText() {
        const template = templateInput.value;
        const count = Number(repeatCount.value);
        const separateByNewline = lineBreakMode.checked;

        if (!Number.isInteger(count) || count < 1) {
          throw new Error('試行回数は 1 以上の整数で入力してください。');
        }

        const blocks = [];
        let foundAnyPattern = false;

        for (let i = 0; i < count; i += 1) {
          const { rendered, matched } = renderOne(template, i);
          if (matched) foundAnyPattern = true;
          blocks.push(rendered);
        }

        if (!foundAnyPattern) {
          throw new Error('入力内に [開始番号,桁数] が見つかりません。例: [101,4]');
        }

        return blocks.join(separateByNewline ? '\n' : '');
      }

      function refreshSerial() {
        try {
          const output = generateSerialText();
          resultOutput.value = output;
          serialMeta.textContent = `文字数: ${output.length}`;
          setStatus(serialStatus, '', '');
        } catch (error) {
          resultOutput.value = '';
          serialMeta.textContent = '文字数: 0';
          setStatus(serialStatus, error.message, 'error');
        }
      }

      function getUnicodeTargets(text) {
        return Array.from(text).filter((char) => !WHITESPACE_PATTERN.test(char));
      }

      function refreshUnicode() {
        const chars = getUnicodeTargets(unicodeInput.value);
        const output = chars
          .map((char) => `${char} ${char.codePointAt(0).toString(16).toUpperCase()}`)
          .join('\n');

        unicodeOutput.value = output;
        unicodeMeta.textContent = `対象文字数: ${chars.length}`;
        setStatus(unicodeStatus, '', '');
      }

      async function copyText(value, statusTarget) {
        if (!value) {
          setStatus(statusTarget, 'コピーする結果がありません。', 'error');
          return;
        }

        try {
          await navigator.clipboard.writeText(value);
          setStatus(statusTarget, '結果をコピーしました。', 'ok');
        } catch (error) {
          setStatus(statusTarget, 'コピーに失敗しました。ブラウザの権限をご確認ください。', 'error');
        }
      }

      function activateTool(toolName) {
        tabs.forEach((tab) => {
          const isActive = tab.dataset.tool === toolName;
          tab.classList.toggle('is-active', isActive);
          tab.setAttribute('aria-selected', String(isActive));
        });

        panels.forEach((panel) => {
          panel.hidden = panel.dataset.panel !== toolName;
        });

        if (toolName === 'serial') refreshSerial();
        if (toolName === 'unicode') refreshUnicode();
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => activateTool(tab.dataset.tool));
      });

      copySerialBtn.addEventListener('click', () => copyText(resultOutput.value, serialStatus));
      templateInput.addEventListener('input', refreshSerial);
      repeatCount.addEventListener('input', refreshSerial);
      lineBreakMode.addEventListener('change', refreshSerial);

      copyUnicodeBtn.addEventListener('click', () => copyText(unicodeOutput.value, unicodeStatus));
      unicodeInput.addEventListener('input', refreshUnicode);

      refreshSerial();
      refreshUnicode();
    })();
  </script>
</body>
</html>
